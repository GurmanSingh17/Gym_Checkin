<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sun Fitness Xpert Gym Daily Attendance</title>
    <style>
      :root {
        --bg: #f3f7fc;
        --card: #fff;
        --text: #10294a;
        --muted: #61748c;
        --line: #d8e3f0;
        --primary: #16847d;
        --primary-dark: #126b65;
        --secondary: #e9eef5;
        --danger: #c52b20;
        --shadow: 0 12px 30px rgba(15, 39, 71, .08);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        background: linear-gradient(180deg, #f7faff 0%, #eef4fb 100%);
        font-family: "Segoe UI", Tahoma, sans-serif;
        color: var(--text);
      }
      .card {
        width: min(820px, 100%);
        padding: 38px 36px 30px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 24px;
        box-shadow: var(--shadow);
        text-align: center;
      }
      h1 { margin: 0; font-size: clamp(1.8rem, 4vw, 2.35rem); line-height: 1.15; }
      .lead { margin: 12px 0 30px; color: var(--muted); font-size: 1.02rem; }
      .choice-text, label { font-weight: 700; }
      .choice-text { margin: 0 0 14px; }
      .tabs-wrap { display: flex; justify-content: center; margin-bottom: 30px; }
      .tabs {
        display: inline-flex;
        gap: 8px;
        padding: 7px;
        border: 1px solid var(--line);
        border-radius: 19px;
        background: #eef3f9;
      }
      .tab {
        min-width: 100px;
        padding: 13px 20px;
        border: 0;
        border-radius: 14px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font: inherit;
        font-weight: 700;
      }
      .tab.active { background: var(--primary); color: #fff; }
      .pane { display: none; }
      .pane.active { display: block; }
      form { display: grid; gap: 22px; }
      .field { display: grid; gap: 10px; }
      label { font-size: 1rem; }
      input {
        width: 100%;
        padding: 17px 16px;
        border: 1px solid var(--line);
        border-radius: 17px;
        background: #e8f0fd;
        color: var(--text);
        font: inherit;
        font-size: 1rem;
        outline: none;
      }
      input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(22, 132, 125, .12); }
      .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 1px; }
      button[type="submit"], .secondary {
        padding: 16px 24px;
        border: 0;
        border-radius: 16px;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
      }
      button[type="submit"] { min-width: 200px; background: var(--primary); color: white; }
      .secondary { min-width: 96px; background: var(--secondary); color: var(--text); }
      button:disabled { opacity: .7; cursor: wait; }
      .status { min-height: 28px; margin-top: 18px; font-weight: 700; line-height: 1.4; }
      .status.success { color: var(--primary-dark); }
      .status.error { color: var(--danger); }
      @media (max-width: 640px) {
        .card { padding: 28px 18px 22px; }
        .tabs { width: min(100%, 240px); }
        .tab { flex: 1; min-width: 0; }
        .actions { flex-direction: column; }
        button[type="submit"], .secondary { width: 100%; }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Sun Fitness Xpert Gym Daily Attendance</h1>
      <p class="lead">Choose Entry or Exit, enter the member details, and save.</p>
      <p class="choice-text">Select attendance type</p>
      <div class="tabs-wrap">
        <div class="tabs" role="tablist" aria-label="Attendance type">
          <button class="tab active" type="button" data-tab="entry" role="tab" aria-selected="true">Entry</button>
          <button class="tab" type="button" data-tab="exit" role="tab" aria-selected="false">Exit</button>
        </div>
      </div>

      <section class="pane active" id="pane-entry">
        <form id="entryForm">
          <div class="field">
            <label for="entryName">Member Name</label>
            <input id="entryName" name="name" type="text" maxlength="120" placeholder="Enter member name" autocomplete="name" required />
          </div>
          <div class="field">
            <label for="entryMembership">Membership Number</label>
            <input id="entryMembership" name="membershipNo" type="text" maxlength="5" pattern="[A-Za-z]-[0-9]{1,3}" title="Use one letter, a hyphen, and 1 to 3 digits (for example, B-07)." autocapitalize="characters" placeholder="e.g., B-07" required />
          </div>
          <div class="actions">
            <button type="submit" id="entrySubmit">Save Entry</button>
            <button type="button" class="secondary" id="entryReset">Clear</button>
          </div>
        </form>
      </section>

      <section class="pane" id="pane-exit">
        <form id="exitForm">
          <div class="field">
            <label for="exitMembership">Membership Number</label>
            <input id="exitMembership" name="membershipNo" type="text" maxlength="5" pattern="[A-Za-z]-[0-9]{1,3}" title="Use one letter, a hyphen, and 1 to 3 digits (for example, B-07)." autocapitalize="characters" placeholder="e.g., B-07" required />
          </div>
          <div class="actions">
            <button type="submit" id="exitSubmit">Save Exit</button>
            <button type="button" class="secondary" id="exitReset">Clear</button>
          </div>
        </form>
      </section>
      <div id="statusMessage" class="status" aria-live="polite"></div>
    </main>

    <script>
      const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwJme2dfojW56MEQ256Wg9faBUvNGRb4eVkC9wgPKi5TMVUBgEs3670q46kD9KbxdSiig/exec";
      const tabs = [...document.querySelectorAll(".tab")];
      const panes = { entry: document.getElementById("pane-entry"), exit: document.getElementById("pane-exit") };
      const entryForm = document.getElementById("entryForm");
      const exitForm = document.getElementById("exitForm");
      const statusMessage = document.getElementById("statusMessage");

      function setStatus(message, type = "") {
        statusMessage.textContent = message;
        statusMessage.className = `status ${type}`.trim();
      }
      function switchTab(name) {
        tabs.forEach(button => {
          const active = button.dataset.tab === name;
          button.classList.toggle("active", active);
          button.setAttribute("aria-selected", String(active));
        });
        Object.entries(panes).forEach(([key, pane]) => pane.classList.toggle("active", key === name));
        setStatus("");
      }
      function requestId() {
        return window.crypto && crypto.randomUUID
          ? crypto.randomUUID()
          : `${Date.now()}-${Math.random().toString(36).slice(2)}`;
      }
      async function postData(payload) {
        const response = await fetch(APPS_SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ ...payload, requestId: requestId() })
        });
        const data = await response.json();
        if (!response.ok || !data.success) throw new Error(data.message || "Unable to save attendance.");
        return data;
      }
      async function submitForm(event, action, form, button, getPayload, progress) {
        event.preventDefault();
        if (!form.reportValidity()) return;
        button.disabled = true;
        setStatus(progress);
        try {
          const result = await postData({ action, ...getPayload() });
          form.reset();
          setStatus(result.message || "Attendance saved successfully.", "success");
        } catch (error) {
          setStatus(error.message || "Attendance could not be saved.", "error");
        } finally {
          button.disabled = false;
        }
      }
      entryForm.addEventListener("submit", event => submitForm(
        event, "entry", entryForm, document.getElementById("entrySubmit"),
        () => ({ name: entryForm.elements.name.value.trim(), membershipNo: entryForm.elements.membershipNo.value.trim() }),
        "Saving entry..."
      ));
      exitForm.addEventListener("submit", event => submitForm(
        event, "exit", exitForm, document.getElementById("exitSubmit"),
        () => ({ membershipNo: exitForm.elements.membershipNo.value.trim() }),
        "Saving exit..."
      ));
      document.getElementById("entryReset").addEventListener("click", () => { entryForm.reset(); setStatus(""); });
      document.getElementById("exitReset").addEventListener("click", () => { exitForm.reset(); setStatus(""); });
      tabs.forEach(button => button.addEventListener("click", () => switchTab(button.dataset.tab)));
    </script>
  </body>
</html>
