<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#132a3a" />
    <title>Sun Fitness Xpert | Gym Check-in</title>
    <style>
      :root {
        font-family: Inter, "Segoe UI", Arial, sans-serif;
        color: #172b3a;
        background: #eef3f5;
        font-synthesis: none;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at 10% 5%, #d9e9ed, transparent 32%), #eef3f5;
        display: grid;
        place-items: center;
        padding: 22px;
      }
      main {
        width: min(100%, 520px);
      }
      .brand {
        color: #617783;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        margin: 0 0 10px 4px;
      }
      .card {
        background: #fff;
        border-radius: 22px;
        padding: clamp(24px, 6vw, 38px);
        box-shadow: 0 20px 60px #15334618;
        border: 1px solid #e5ecef;
      }
      h1 {
        font-size: clamp(27px, 6vw, 36px);
        line-height: 1.1;
        margin: 0 0 10px;
        color: #132a3a;
      }
      .intro {
        margin: 0 0 24px;
        color: #637782;
        line-height: 1.55;
      }
      .choices {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-bottom: 22px;
      }
      .choice {
        position: relative;
      }
      .choice input {
        position: absolute;
        opacity: 0;
        inset: 0;
        width: 100%;
        height: 100%;
        cursor: pointer;
      }
      .choice span {
        display: block;
        text-align: center;
        padding: 13px;
        border: 1px solid #cbd8de;
        border-radius: 11px;
        font-weight: 750;
        color: #526a77;
      }
      .choice input:checked + span {
        background: #147e78;
        border-color: #147e78;
        color: white;
      }
      .choice input:focus-visible + span {
        outline: 3px solid #147e8340;
      }
      label.field-label {
        display: block;
        font-weight: 700;
        font-size: 14px;
        margin: 0 0 8px;
      }
      input[type="text"] {
        width: 100%;
        height: 52px;
        border: 1px solid #cbd8de;
        border-radius: 11px;
        padding: 0 14px;
        font: inherit;
        color: #132a3a;
        background: #fff;
        margin-bottom: 18px;
        outline: none;
      }
      input[type="text"]:focus {
        border-color: #168b83;
        box-shadow: 0 0 0 3px #168b8320;
      }
      .hint {
        color: #788a93;
        font-size: 12px;
        margin: -10px 0 20px;
      }
      button {
        width: 100%;
        height: 54px;
        border: 0;
        border-radius: 11px;
        background: #147e78;
        color: #fff;
        font-size: 16px;
        font-weight: 750;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: wait;
      }
      .result {
        display: none;
        margin-top: 20px;
        padding: 16px;
        border-radius: 12px;
        line-height: 1.5;
      }
      .result.show {
        display: block;
      }
      .result strong {
        display: block;
        font-size: 17px;
        margin-bottom: 4px;
      }
      .result p {
        margin: 0;
      }
      .good {
        background: #e8f6ee;
        color: #17633b;
      }
      .soon {
        background: #fff5df;
        color: #805500;
      }
      .bad {
        background: #fdebea;
        color: #8a2822;
      }
      .neutral {
        background: #edf3f6;
        color: #355161;
      }
      .footer {
        color: #71828b;
        font-size: 12px;
        text-align: center;
        margin: 18px 0 0;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      @media (max-width: 420px) {
        body {
          padding: 14px;
        }
        .card {
          border-radius: 17px;
        }
      }
      .response-frame {
        display: none;
        width: 100%;
        height: 190px;
        border: 1px solid #d7e3e8;
        border-radius: 12px;
        margin-top: 12px;
        background: #fff;
      }
      .response-frame.show {
        display: block;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">Sun Fitness Xpert</p>
      <section class="card" aria-labelledby="title">
        <h1 id="title">Gym visit</h1>
        <p class="intro">
          Enter your name and membership number to record your visit and check
          your membership expiry.
        </p>
        <form id="visitForm">
          <label class="field-label" for="memberName">Your name</label
          ><input
            id="memberName"
            name="memberName"
            type="text"
            autocomplete="name"
            maxlength="100"
            required
            placeholder="Enter your name"
          />
          <label class="field-label" for="membershipNo"
            >Membership number</label
          >
          <input
            id="membershipNo"
            name="membershipNo"
            type="text"
            autocomplete="off"
            maxlength="50"
            required
            placeholder="e.g. A-54 or 23G 21"
          />
          <p class="hint">
            Spaces, hyphens, and letter case are ignored when matching your
            number.
          </p>
          <label class="sr-only" for="website">Leave this field empty</label
          ><input
            id="website"
            name="website"
            type="text"
            tabindex="-1"
            autocomplete="off"
            aria-hidden="true"
            style="position: absolute; left: -10000px"
          />
          <button id="submitBtn" type="submit">Record entry</button>
        </form>
        <div id="result" class="result" role="status" aria-live="polite"></div>
      </section>
      <p class="footer">
        Your membership is checked against the gym’s membership records.
      </p>
    </main>
    <iframe
      id="visitResponse"
      name="visitResponse"
      title="Check-in result from the gym server"
      class="response-frame"
    ></iframe>
    <script>
      // Set this to the deployed Apps Script Web App URL ending in /exec.
      const BACKEND_URL =
        "https://script.google.com/macros/s/AKfycbwbuHns6nTYrdtUSOKVP0PcuRFlpyyqSn3bcw-supT4t9O7CVEjVl0iUBkVZBAK4JNvMA/exec";
      const form = document.getElementById("visitForm"),
        button = document.getElementById("submitBtn"),
        resultBox = document.getElementById("result"),
        nameInput = document.getElementById("memberName"),
        responseFrame = document.getElementById("visitResponse");
      let pendingRequest = "",
        responseTimer,
        requestInProgress = false;
      function showResult(kind, title, detail) {
        resultBox.className = "result show " + kind;
        resultBox.replaceChildren();
        const h = document.createElement("strong"),
          p = document.createElement("p");
        h.textContent = title;
        p.textContent = detail;
        resultBox.append(h, p);
      }
      window.addEventListener("message", function (event) {
        const m = event.data;
        if (
          !m ||
          m.type !== "gym-visit-result" ||
          m.requestId !== pendingRequest
        )
          return;
        clearTimeout(responseTimer);
        requestInProgress = false;
        pendingRequest = "";
        button.disabled = false;
        button.textContent = "Record entry";
        responseFrame.classList.remove("show");
        if (!m.ok) {
          showResult(
            "bad",
            "Entry could not be recorded",
            m.message || "Please try again or ask gym staff for help.",
          );
          return;
        }
        const kind =
          m.status === "Expired"
            ? "bad"
            : m.status === "Expiring soon"
              ? "soon"
              : m.status === "Valid"
                ? "good"
                : "neutral";
        showResult(
          kind,
          "Entry recorded · " + m.status,
          "Expiry: " + (m.expiryDate || "Not found"),
        );
        form.reset();
      });
      responseFrame.addEventListener("load", function () {
        if (!requestInProgress) return;
        requestInProgress = false;
        clearTimeout(responseTimer);
        setTimeout(function () {
          if (!pendingRequest) return;
          button.disabled = false;
          button.textContent = "Record entry";
          showResult(
            "neutral",
            "Backend response received",
            "See the result panel below. If it reports an error, correct the details and submit again.",
          );
        }, 1000);
      });
      form.addEventListener("submit", function (event) {
        event.preventDefault();
        if (
          BACKEND_URL.indexOf("/exec") === -1 ||
          BACKEND_URL.indexOf("PASTE_") === 0
        ) {
          showResult(
            "neutral",
            "Setup required",
            "Add the deployed Apps Script Web App URL to index.html before publishing.",
          );
          return;
        }
        pendingRequest =
          window.crypto && crypto.randomUUID
            ? crypto.randomUUID()
            : String(Date.now()) + Math.random().toString(16).slice(2);
        const payload = document.createElement("form");
        payload.method = "post";
        payload.action = BACKEND_URL;
        payload.target = "visitResponse";
        payload.acceptCharset = "UTF-8";
        const values = {
          action: "ENTER",
          memberName: nameInput.value.trim(),
          membershipNo: document.getElementById("membershipNo").value.trim(),
          website: document.getElementById("website").value,
          requestId: pendingRequest,
        };
        Object.keys(values).forEach(function (key) {
          const input = document.createElement("input");
          input.type = "hidden";
          input.name = key;
          input.value = values[key];
          payload.appendChild(input);
        });
        document.body.appendChild(payload);
        requestInProgress = true;
        responseFrame.classList.add("show");
        button.disabled = true;
        button.textContent = "Recording entry…";
        showResult(
          "neutral",
          "Please wait",
          "Checking expiry and recording your visit.",
        );
        payload.submit();
        setTimeout(function () {
          payload.remove();
        }, 1000);
        responseTimer = setTimeout(function () {
          button.disabled = false;
          button.textContent = "Record entry";
          showResult(
            "bad",
            "No backend response",
            "The server did not return a result. Check the response panel below before submitting again.",
          );
        }, 20000);
      });
    </script>
  </body>
</html>
