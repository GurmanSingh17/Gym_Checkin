<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f3f7fc" />
    <title>Sun Fitness Xpert Gym Daily Attendance</title>
    <style>
      :root {
        --bg: #f3f7fc;
        --card: #fff;
        --text: #102a4c;
        --muted: #62748b;
        --line: #d9e3ef;
        --primary: #157e78;
        --primary-hover: #116760;
        --soft: #edf3fa;
        --danger: #b42318;
        --success: #126b48;
        --radius: 22px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        margin: 0;
        padding: 18px;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, #f8fbff 0%, var(--bg) 100%);
        color: var(--text);
        font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      }
      main {
        width: min(820px, 100%);
        padding: clamp(24px, 5vw, 38px);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--card);
        box-shadow: 0 14px 36px rgba(16, 42, 76, 0.09);
        text-align: center;
      }
      h1 {
        margin: 0;
        font-size: clamp(1.8rem, 5vw, 2.45rem);
        line-height: 1.12;
      }
      .intro {
        margin: 12px 0 28px;
        color: var(--muted);
        line-height: 1.5;
      }
      .type-label {
        margin: 0 0 14px;
        font-weight: 700;
      }
      .tabs {
        display: inline-flex;
        gap: 8px;
        margin: 0 0 30px;
        padding: 7px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: var(--soft);
      }
      .tab {
        min-width: 100px;
        padding: 13px 20px;
        border: 0;
        border-radius: 13px;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      .tab[aria-selected="true"] {
        background: var(--primary);
        color: #fff;
      }
      .pane {
        display: none;
      }
      .pane.active {
        display: block;
      }
      form {
        display: grid;
        gap: 21px;
      }
      .field {
        display: grid;
        gap: 9px;
      }
      label {
        font-weight: 700;
      }
      input {
        width: 100%;
        min-height: 58px;
        padding: 15px 16px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: #f9fbfe;
        color: var(--text);
        font: inherit;
        font-size: 1rem;
      }
      input:focus {
        outline: 3px solid rgba(21, 126, 120, 0.17);
        border-color: var(--primary);
        background: #fff;
      }
      .actions {
        display: flex;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 2px;
      }
      button.submit,
      button.clear {
        min-height: 54px;
        padding: 14px 24px;
        border: 0;
        border-radius: 15px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button.submit {
        min-width: 200px;
        background: var(--primary);
        color: white;
      }
      button.submit:hover {
        background: var(--primary-hover);
      }
      button.clear {
        min-width: 96px;
        background: #e9eef5;
        color: var(--text);
      }
      button:disabled {
        opacity: 0.65;
        cursor: wait;
      }
      #status {
        min-height: 26px;
        margin: 18px 0 0;
        font-weight: 700;
        overflow-wrap: anywhere;
      }
      #status.error {
        color: var(--danger);
      }
      #status.success {
        color: var(--success);
      }
      @media (max-width: 560px) {
        body {
          padding: 10px;
        }
        main {
          padding: 24px 17px;
        }
        .tabs {
          display: flex;
          width: 100%;
        }
        .tab {
          flex: 1;
          min-width: 0;
        }
        .actions {
          flex-direction: column;
        }
        button.submit,
        button.clear {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sun Fitness Xpert Gym Daily Attendance</h1>
      <p class="intro">
        Choose Entry or Exit, enter the member details, and save.
      </p>
      <p class="type-label">Select attendance type</p>

      <div class="tabs" role="tablist" aria-label="Attendance type">
        <button
          class="tab"
          id="entryTab"
          type="button"
          role="tab"
          aria-selected="true"
          aria-controls="entryPane"
        >
          Entry
        </button>
        <button
          class="tab"
          id="exitTab"
          type="button"
          role="tab"
          aria-selected="false"
          aria-controls="exitPane"
        >
          Exit
        </button>
      </div>

      <section
        class="pane active"
        id="entryPane"
        role="tabpanel"
        aria-labelledby="entryTab"
      >
        <form id="entryForm">
          <div class="field">
            <label for="entryName">Member Name</label>
            <input
              id="entryName"
              name="name"
              type="text"
              autocomplete="name"
              placeholder="Enter member name"
              required
            />
          </div>
          <div class="field">
            <label for="entryMembership">Membership Number</label>
            <input
              id="entryMembership"
              name="membershipNo"
              type="text"
              placeholder="Enter membership number"
              required
            />
          </div>
          <div class="actions">
            <button class="submit" id="entrySubmit" type="submit">
              Save Entry
            </button>
            <button class="clear" type="reset">Clear</button>
          </div>
        </form>
      </section>

      <section
        class="pane"
        id="exitPane"
        role="tabpanel"
        aria-labelledby="exitTab"
      >
        <form id="exitForm">
          <div class="field">
            <label for="exitMembership">Membership Number</label>
            <input
              id="exitMembership"
              name="membershipNo"
              type="text"
              placeholder="Enter membership number"
              required
            />
          </div>
          <div class="actions">
            <button class="submit" id="exitSubmit" type="submit">
              Save Exit
            </button>
            <button class="clear" type="reset">Clear</button>
          </div>
        </form>
      </section>

      <p id="status" role="status" aria-live="polite">
        Please choose Entry or Exit to continue.
      </p>
    </main>

    <script>
      // Paste the deployed Apps Script Web App URL ending in /exec here.
      const APPS_SCRIPT_URL =
        "https://script.google.com/macros/s/AKfycbwJme2dfojW56MEQ256Wg9faBUvNGRb4eVkC9wgPKi5TMVUBgEs3670q46kD9KbxdSiig/exec";

      const entryTab = document.getElementById("entryTab");
      const exitTab = document.getElementById("exitTab");
      const entryPane = document.getElementById("entryPane");
      const exitPane = document.getElementById("exitPane");
      const status = document.getElementById("status");

      function setStatus(message, kind = "") {
        status.textContent = message;
        status.className = kind;
      }

      function switchTab(showEntry) {
        entryTab.setAttribute("aria-selected", String(showEntry));
        exitTab.setAttribute("aria-selected", String(!showEntry));
        entryPane.classList.toggle("active", showEntry);
        exitPane.classList.toggle("active", !showEntry);
        setStatus("");
        document
          .getElementById(showEntry ? "entryName" : "exitMembership")
          .focus();
      }

      entryTab.addEventListener("click", () => switchTab(true));
      exitTab.addEventListener("click", () => switchTab(false));

      async function submitAttendance(payload, button) {
        if (!APPS_SCRIPT_URL) {
          setStatus(
            "Setup needed: add the deployed Apps Script URL in this file.",
            "error",
          );
          return;
        }
        button.disabled = true;
        setStatus(
          payload.action === "entry" ? "Saving entry…" : "Saving exit…",
        );
        try {
          const response = await fetch(APPS_SCRIPT_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(payload),
          });
          const result = await response.json();
          if (!response.ok || !result.success) {
            throw new Error(
              result.message || `Request failed (HTTP ${response.status}).`,
            );
          }
          document
            .getElementById(
              payload.action === "entry" ? "entryForm" : "exitForm",
            )
            .reset();
          setStatus(result.message || "Attendance saved.", "success");
        } catch (error) {
          setStatus(
            error.message || "Could not contact the attendance service.",
            "error",
          );
        } finally {
          button.disabled = false;
        }
      }

      document
        .getElementById("entryForm")
        .addEventListener("submit", (event) => {
          event.preventDefault();
          const values = new FormData(event.currentTarget);
          const name = String(values.get("name") || "").trim();
          const membershipNo = String(values.get("membershipNo") || "").trim();
          if (!name || !membershipNo) {
            setStatus("Enter both member name and membership number.", "error");
            return;
          }
          submitAttendance(
            { action: "entry", name, membershipNo },
            document.getElementById("entrySubmit"),
          );
        });

      document
        .getElementById("exitForm")
        .addEventListener("submit", (event) => {
          event.preventDefault();
          const membershipNo = String(
            new FormData(event.currentTarget).get("membershipNo") || "",
          ).trim();
          if (!membershipNo) {
            setStatus("Enter the membership number for exit.", "error");
            return;
          }
          submitAttendance(
            { action: "exit", membershipNo },
            document.getElementById("exitSubmit"),
          );
        });

      document.querySelectorAll("form").forEach((form) => {
        form.addEventListener("reset", () => setStatus(""));
      });
    </script>
  </body>
</html>
